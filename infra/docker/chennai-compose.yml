name: oem-chennai-demo
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: oem_chennai_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chennai-local
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "oem_chennai_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres:
